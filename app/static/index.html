<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breast cancer classifier</title>
  <style>
    :root {
      --ink: #1f2430;
      --muted: #6b7280;
      --line: #ddd8e6;
      --accent: #5b4b8a;
      --paper: #faf9f7;
      --good: #1c7c54;
      --bad: #a33a3a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .card {
      width: 100%;
      max-width: 820px;
      padding: 28px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    h1 { margin: 0 0 4px; font: 600 26px/1.2 Georgia, "Times New Roman", serif; }
    h2 {
      margin: 22px 0 10px;
      font: 600 13px/1.2 system-ui, sans-serif;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }
    .sub { margin: 0; font-size: 14px; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr 1fr; } }
    label { display: block; margin-bottom: 4px; font-size: 12px; color: var(--muted); }
    input {
      width: 100%;
      padding: 7px 9px;
      font: inherit;
      color: var(--ink);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
    button {
      width: 100%;
      margin-top: 22px;
      padding: 11px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: #4a3d72; }
    #result {
      min-height: 22px;
      margin: 16px 0 0;
      font-size: 15px;
      color: var(--muted);
      text-align: center;
    }
    #result.good { color: var(--good); font-weight: 600; }
    #result.bad { color: var(--bad); font-weight: 600; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Breast cancer classifier</h1>
    <p class="sub">
      A random forest trained on 569 digitised cell-nucleus images (30 measurements each).
      The fields start with one real sample from that dataset.
    </p>
    <form id="predict-form">
      <button type="submit">Predict</button>
    </form>
    <p id="result">Adjust the values, then press Predict.</p>
  </main>
  <script>
    // [field name sent to the API, label shown on the page, default value]
    const GROUPS = [
      {
        title: "Mean values",
        fields: [
          ["mean_radius", "Radius", 17.99],
          ["mean_texture", "Texture", 10.38],
          ["mean_perimeter", "Perimeter", 122.8],
          ["mean_area", "Area", 1001],
          ["mean_smoothness", "Smoothness", 0.1184],
          ["mean_compactness", "Compactness", 0.2776],
          ["mean_concavity", "Concavity", 0.3001],
          ["mean_concave_points", "Concave points", 0.1471],
          ["mean_symmetry", "Symmetry", 0.2419],
          ["mean_fractal_dimension", "Fractal dimension", 0.07871]
        ]
      },
      {
        title: "Standard error",
        fields: [
          ["radius_error", "Radius", 1.095],
          ["texture_error", "Texture", 0.9053],
          ["perimeter_error", "Perimeter", 8.589],
          ["area_error", "Area", 153.4],
          ["smoothness_error", "Smoothness", 0.006399],
          ["compactness_error", "Compactness", 0.04904],
          ["concavity_error", "Concavity", 0.05373],
          ["concave_points_error", "Concave points", 0.01587],
          ["symmetry_error", "Symmetry", 0.03003],
          ["fractal_dimension_error", "Fractal dimension", 0.006193]
        ]
      },
      {
        title: "Worst values",
        fields: [
          ["worst_radius", "Radius", 25.38],
          ["worst_texture", "Texture", 17.33],
          ["worst_perimeter", "Perimeter", 184.6],
          ["worst_area", "Area", 2019],
          ["worst_smoothness", "Smoothness", 0.1622],
          ["worst_compactness", "Compactness", 0.6656],
          ["worst_concavity", "Concavity", 0.7119],
          ["worst_concave_points", "Concave points", 0.2654],
          ["worst_symmetry", "Symmetry", 0.4601],
          ["worst_fractal_dimension", "Fractal dimension", 0.1189]
        ]
      }
    ];

    const form = document.getElementById("predict-form");
    const button = form.querySelector("button");
    const result = document.getElementById("result");
    const keys = [];

    // Build the form from GROUPS so the 30 inputs are written only once
    for (const group of GROUPS) {
      const heading = document.createElement("h2");
      heading.textContent = group.title;
      const grid = document.createElement("div");
      grid.className = "grid";

      for (const [key, label, value] of group.fields) {
        keys.push(key);
        const cell = document.createElement("div");
        cell.innerHTML = '<label for="' + key + '">' + label + '</label>'
          + '<input id="' + key + '" type="number" step="any" min="0" value="'
          + value + '" required>';
        grid.appendChild(cell);
      }

      // Keep the Predict button as the last thing in the form
      form.insertBefore(heading, button);
      form.insertBefore(grid, button);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const values = {};
      for (const key of keys) {
        values[key] = parseFloat(document.getElementById(key).value);
      }

      result.className = "";
      result.textContent = "Predicting...";
      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(values)
        });
        if (!response.ok) throw new Error("HTTP " + response.status);
        const data = await response.json();
        const label = data.prediction[0].toUpperCase() + data.prediction.slice(1);
        result.textContent = label + " — "
          + (data.confidence * 100).toFixed(1) + "% confidence";
        result.className = data.prediction === "malignant" ? "bad" : "good";
      } catch (error) {
        result.textContent = "No prediction. Check the values and try again.";
      }
    });
  </script>
</body>
</html>
